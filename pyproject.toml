[project]
name = "f1pitstop"
version = "0.1.0"
description = "F1 Pit Stop Prediction — leakage-aware ML pipeline vs AutoML (Kaggle Playground Series S6E5)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "autogluon-tabular>=1.6.1",
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "mlflow>=3.15.2",
    "pandas>=2.3.3",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "scikit-learn>=1.9.0",
    "skops>=0.14.0",
    "skore>=0.25.0",
    "skrub>=0.10.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1pitstop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: fits a real model (AutoGluon, etc.) even on toy data — excluir con `-m 'not slow'` para una corrida rapida.",
]

[tool.ruff]
line-length = 100
extend-exclude = [".claude"]

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
]
